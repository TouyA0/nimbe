name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : la CI ne publie rien.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Launcher Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25" # même version que gradle/gradle-daemon-jvm.properties
      - uses: gradle/actions/setup-gradle@v6
      - name: Compiler et tester
        run: ./gradlew --console=plain assembleDebug testDebugUnitTest

  go:
    name: Outil de debloat
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debloat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: debloat/go.mod
          cache-dependency-path: debloat/go.mod
      - name: Vérifier le formatage
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
